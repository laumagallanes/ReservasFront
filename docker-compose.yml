version: "3.9"

services:
  server:
    build: ./server
    expose:
      - "3000"
    networks:
      - backend
    env_file:
      - .env
    volumes:
      - ./server/data:/app/data
      - ./server/uploads:/app/uploads
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - backend
    volumes:
      - db_data:/var/lib/mysql

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: /api
    expose:
      - "80"
    depends_on:
      - server
    networks:
      - backend
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TOKEN}
    depends_on:
      - client
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  db_data: