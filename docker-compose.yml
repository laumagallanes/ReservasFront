
services:
  server:
    build: ./server
    ports:
      - "3001:3000"
    environment:
      - RESERVATION_URL=https://reservas.im-soluciones.com/
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=admin_pass
      - DB_NAME=latteame
      - JWT_SECRET=super_secret_key_123
    volumes:
      - ./server/data:/app/data
      - ./server/uploads:/app/uploads
    depends_on:
      - db

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: admin_pass
      MYSQL_DATABASE: latteame
    ports:
      - "3309:3306"
    volumes:
      - db_data:/var/lib/mysql

  client:
    build: ./client
    ports:
      - "88:80"
    depends_on:
      - server

volumes:
  db_data:
