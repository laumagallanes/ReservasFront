services:
  server:
    build: ./server
    expose:
      - "3000"
    networks:
      - backend
    environment:
      - RESERVATION_URL=https://reservas.im-soluciones.com/
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=admin_pass
      - DB_NAME=latteame
      - JWT_SECRET=super_secret_key_123
    volumes:
      - ./server/data:/app/data
      - ./server/uploads:/app/uploads
    depends_on:
      - db

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: admin_pass
      MYSQL_DATABASE: latteame

    networks:
      - backend
    volumes:
      - db_data:/var/lib/mysql

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: /api
    expose:
      - "80"
    depends_on:
      - server
    networks:
      - backend

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TOKEN}
    depends_on:
      - client
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  db_data:
